<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auroria</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/styles.css">
<script>
// The accent drives the whole palette, flame included: fire colours keep their orange-to-red spread, turned to the accent's hue.
window.auroriaAccent = function (hex) {
  const h = /^#[0-9a-f]{6}$/i.test(hex || '') ? hex.toLowerCase() : '#f07f2a';
  const rgb = [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const mix = (t, k) => '#' + rgb.map((c) => Math.round(c + (t - c) * k).toString(16).padStart(2, '0')).join('');
  const lum = (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255;
  const [r0, g0, b0] = rgb.map((c) => c / 255); const mx = Math.max(r0, g0, b0), mn = Math.min(r0, g0, b0);
  let hue = 0; if (mx !== mn) { const d = mx - mn; hue = mx === r0 ? ((g0 - b0) / d) % 6 : mx === g0 ? (b0 - r0) / d + 2 : (r0 - g0) / d + 4; hue = (hue * 60 + 360) % 360; }
  const sat = mx === mn ? 0 : (mx - mn) / (1 - Math.abs(mx + mn - 1));
  const hsl = (dh, sk, l) => `hsl(${Math.round((hue + dh + 360) % 360)} ${Math.round(Math.min(1, sat * sk) * 100)}% ${l}%)`;
  const vars = { '--accent': h, '--accent-rgb': rgb.join(','), '--accent-hi': mix(255, 0.14), '--accent-lo': mix(0, 0.07), '--accent-soft': mix(255, 0.42), '--accent-ink': lum > 0.42 ? '#1a0f08' : '#ffffff' };
  if (h !== '#f07f2a') Object.assign(vars, {
    '--fire-1': hsl(19, 1.1, 89), '--fire-2': hsl(14, 1.1, 74), '--fire-3': hsl(5, 1.1, 59), '--fire-4': hsl(-7, 1.0, 50), '--fire-5': hsl(-14, 1.0, 41),
    '--fire-sh1': hsl(-5, 0.95, 28), '--fire-sh2': hsl(-8, 0.95, 12), '--fire-glow': rgb.join(','),
    '--logo-filter': `hue-rotate(${Math.round(hue - 26)}deg) saturate(${Math.max(0.15, Math.min(1.4, sat / 0.86)).toFixed(2)})`,
  });
  // Each theme is a mood for the same scene: a colour grade on the background and matching light on the character.
  const SCENES = {
    '#e5484d': { tint: '#ff3b2f', a: 0.32, soft: 0.25, filter: 'saturate(1.05) brightness(.9)', sun: '#ff7a5c', amb: '#8a4a3e', fog: '#a0483a' },
    '#f5b82e': { tint: '#ffc23a', a: 0.22, soft: 0.2, filter: 'brightness(1.04)', sun: '#ffd27a', amb: '#a8905e', fog: '#d0a85a' },
    '#5fb34a': { tint: '#7bd65a', a: 0.2, soft: 0.18, filter: 'saturate(1.1) brightness(1.05)', sun: '#fff1c0', amb: '#7f9a6a', fog: '#a8b88a' },
    '#2ec4b6': { tint: '#2ad1c4', a: 0.3, soft: 0.22, filter: 'brightness(.95)', sun: '#bff5ef', amb: '#5a8a86', fog: '#6aa8a2' },
    '#4a8fe0': { tint: '#3a7bdc', a: 0.42, soft: 0.3, filter: 'brightness(.72) saturate(.9)', sun: '#a9c8ff', amb: '#4a5c80', fog: '#3c5682' },
    '#9b6cf0': { tint: '#9a5cf5', a: 0.36, soft: 0.26, filter: 'brightness(.85)', sun: '#d6b8ff', amb: '#6a5a8a', fog: '#7a5aa8' },
    '#e85d9e': { tint: '#ff6fae', a: 0.3, soft: 0.24, filter: 'brightness(.98)', sun: '#ffc2dc', amb: '#8a5a70', fog: '#c07a98' },
  };
  const sc = h === '#f07f2a' ? null : SCENES[h] || { tint: h, a: 0.28, soft: 0.2, filter: 'none', sun: mix(255, 0.5), amb: mix(60, 0.55), fog: mix(120, 0.4) };
  const hexRgb = (x) => [1, 3, 5].map((i) => parseInt(x.slice(i, i + 2), 16)).join(',');
  window.auroriaTheme = sc ? { sun: sc.sun, amb: sc.amb, fog: sc.fog } : { sun: '#ffb36b', amb: '#a8835e', fog: '#c8925a', cam: '#e8b98a' };
  Object.assign(vars, sc
    ? { '--scene-tint': sc.tint, '--scene-tint-a': sc.a, '--scene-soft-a': sc.soft, '--scene-filter': sc.filter, '--char-glow': hexRgb(sc.sun), '--char-sepia': 0.05 }
    : { '--scene-tint': 'transparent', '--scene-tint-a': 0, '--scene-soft-a': 0, '--scene-filter': 'none', '--char-glow': '255,165,80', '--char-sepia': 0.16 });
  const root = document.documentElement.style;
  for (const k of ['--fire-1', '--fire-2', '--fire-3', '--fire-4', '--fire-5', '--fire-sh1', '--fire-sh2', '--fire-glow', '--logo-filter']) root.removeProperty(k);
  for (const [k, v] of Object.entries(vars)) root.setProperty(k, v);
};
window.auroriaAccent('__ACCENT__');
</script>
<style>
html, body { background: #0d0906; }
#boot { position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center; background: #0d0906; transition: opacity .45s ease; }
#boot img { width: 84px; height: 84px; animation: boot-pulse 1.4s ease-in-out infinite; filter: var(--logo-filter, none) drop-shadow(0 0 26px rgba(var(--fire-glow, 255,120,30),.5)); }
body.ready #boot { opacity: 0; pointer-events: none; }
@keyframes boot-pulse { 0%, 100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.08); opacity: 1; } }
</style>
</head>
<body>
<div id="boot" aria-hidden="true"><img src="/favicon.ico" alt=""></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="fi-fire" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" style="stop-color:var(--fire-2)"/><stop offset="45%" style="stop-color:var(--fire-3)"/><stop offset="100%" style="stop-color:var(--fire-4)"/></linearGradient>
    <filter id="fi-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <g id="fi-home" fill="none" stroke="url(#fi-fire)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M3 10.5 L12 3 L21 10.5 V20 a1 1 0 0 1 -1 1 H15 V14 H9 V21 H4 a1 1 0 0 1 -1 -1 Z"/></g>
    <g id="fi-profiles" fill="none" stroke="url(#fi-fire)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5 H7.01 M7 17.5 H7.01"/></g>
    <g id="fi-mods" fill="none" stroke="url(#fi-fire)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2 L21 7 V17 L12 22 L3 17 V7 Z"/><path d="M3 7 L12 12 L21 7"/><path d="M12 12 V22"/></g>
    <g id="fi-skins" fill="none" stroke="url(#fi-fire)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M8 3 L3 6 L5 10 L7 9 V21 H17 V9 L19 10 L21 6 L16 3 C15 5 9 5 8 3 Z"/></g>
    <g id="fi-logs" fill="url(#fi-fire)" stroke="url(#fi-fire)" stroke-width="1.2" stroke-linejoin="round"><path d="M12.5 2.5c.4 3.2 4.7 5.2 4.7 10.2a5.2 5.2 0 0 1-10.4 0c0-2.1 1-3.6 2.1-4.7.1 1.8.9 2.7 1.8 3 .2-3.7-.4-5.6 1.8-8.5z"/><path d="M12 21a3.1 3.1 0 0 1-3.1-3.1c0-1.5 1.1-2.5 1.9-3.6.3 1 1 1.4 1.3 1.9.5-.6.9-1.2 1-2 1.1 1 2 2.3 2 3.7A3.1 3.1 0 0 1 12 21z" style="fill:var(--fire-2)" stroke="none"/></g>
    <g id="fi-config" fill="none" stroke="url(#fi-fire)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M18.92 10.01 L21.36 10.35 L21.36 13.65 L18.92 13.99 L18.30 15.49 L19.78 17.45 L17.45 19.78 L15.49 18.30 L13.99 18.92 L13.65 21.36 L10.35 21.36 L10.01 18.92 L8.51 18.30 L7.55 19.78 L5.22 17.45 L5.70 15.49 L5.08 13.99 L2.64 13.65 L2.64 10.35 L5.08 10.01 L5.70 8.51 L5.22 6.55 L7.55 4.22 L8.51 5.70 L10.01 5.08 L10.35 2.64 L13.65 2.64 L13.99 5.08 L15.49 5.70 L17.45 4.22 L19.78 6.55 L18.30 8.51 Z"/><circle cx="12" cy="12" r="3"/></g>
  </defs>
</svg>
<div class="app" id="app">
  <div class="scene" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>

  <nav class="rail" aria-label="Main">
    <span class="rail-indicator" aria-hidden="true"></span>
    <button class="logo" data-action="go" data-page="home" aria-label="Auroria home">
      <img src="/favicon.ico" alt="" width="40" height="40">
    </button>
    <button class="nav" data-action="go" data-page="home"><i class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"/></svg><svg class="fire" viewBox="0 0 24 24" aria-hidden="true"><use href="#fi-home" filter="url(#fi-glow)"/></svg></i><span>Home</span></button>
    <button class="nav" data-action="go" data-page="servers"><i class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/><path d="M8 7h.01M8 17h.01"/></svg><svg class="fire" viewBox="0 0 24 24" aria-hidden="true"><use href="#fi-profiles" filter="url(#fi-glow)"/></svg></i><span>Profiles</span></button>
    <button class="nav" data-action="go" data-page="mods"><i class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg><svg class="fire" viewBox="0 0 24 24" aria-hidden="true"><use href="#fi-mods" filter="url(#fi-glow)"/></svg></i><span>Mods</span></button>
    <button class="nav" data-action="go" data-page="skins"><i class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4l-5 3 2 4 2-1v10h10V10l2 1 2-4-5-3c0 2-1.8 3-4 3S8 6 8 4z"/></svg><svg class="fire" viewBox="0 0 24 24" aria-hidden="true"><use href="#fi-skins" filter="url(#fi-glow)"/></svg></i><span>Skins</span></button>
    <button class="nav" id="nav-logs" data-action="go" data-page="logs" hidden><i class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 2.5c.4 3.2 4.7 5.2 4.7 10.2a5.2 5.2 0 0 1-10.4 0c0-2.1 1-3.6 2.1-4.7.1 1.8.9 2.7 1.8 3 .2-3.7-.4-5.6 1.8-8.5z"/></svg><svg class="fire" viewBox="0 0 24 24" aria-hidden="true"><use href="#fi-logs" filter="url(#fi-glow)"/></svg></i><span>Logs</span></button>
    <button class="nav nav-settings" data-action="go" data-page="settings" aria-label="Settings"><i class="nav-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.92 10.01 L21.36 10.35 L21.36 13.65 L18.92 13.99 L18.30 15.49 L19.78 17.45 L17.45 19.78 L15.49 18.30 L13.99 18.92 L13.65 21.36 L10.35 21.36 L10.01 18.92 L8.51 18.30 L7.55 19.78 L5.22 17.45 L5.70 15.49 L5.08 13.99 L2.64 13.65 L2.64 10.35 L5.08 10.01 L5.70 8.51 L5.22 6.55 L7.55 4.22 L8.51 5.70 L10.01 5.08 L10.35 2.64 L13.65 2.64 L13.99 5.08 L15.49 5.70 L17.45 4.22 L19.78 6.55 L18.30 8.51 Z" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke-width="1.8"/></svg><svg class="fire" viewBox="0 0 24 24" aria-hidden="true"><use href="#fi-config" filter="url(#fi-glow)"/></svg></i></button>
  </nav>

  <div class="drag-strip" data-drag aria-hidden="true"></div>
  <div class="winctl" id="winctl" hidden>
    <button data-action="win" data-v="min" aria-label="Minimise"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
    <button data-action="win" data-v="max" aria-label="Maximise"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
    <button class="close" data-action="win" data-v="close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
  </div>
  <div class="account" id="account"></div>
  <main class="page" id="page"></main>
</div>

<div class="modal-wrap" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" id="modal-body"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="update-bar" id="update-bar" role="status" hidden></div>
<input type="file" id="skin-file" accept="image/png" hidden>
<input type="file" id="icon-file" accept="image/*" hidden>
<input type="file" id="mrpack-file" accept=".mrpack,application/zip" hidden>
<script src="/skinview3d.js"></script>
<script src="/app.js"></script>
</body>
</html>

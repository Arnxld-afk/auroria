<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concept B: Dashboard</title><link rel="icon" href="assets/flame.ico"><link rel="stylesheet" href="shared.css">
<style>
/* B: the home page becomes a launch pad. One glass card holds the selected profile, its stats and PLAY; small widgets sit below. */
.shade { background: linear-gradient(90deg, rgba(10,6,3,.55) 0%, rgba(10,6,3,.15) 55%, transparent 80%), linear-gradient(0deg, rgba(10,6,3,.5), transparent 30%); }
.main { position: absolute; z-index: 4; left: 124px; top: 86px; width: 470px; display: flex; flex-direction: column; gap: 14px; }
.hello { font-size: 13px; color: var(--soft); font-weight: 600; }
.hello b { color: var(--fg); }
.card { padding: 22px; border-radius: 22px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(16px); box-shadow: 0 24px 60px rgba(0,0,0,.35); }
.profile-top { display: flex; align-items: center; gap: 16px; }
.profile-top .tile-ico { width: 68px; height: 68px; font-size: 25px; border-radius: 18px; }
.profile-top h2 { margin: 0; font-family: var(--display); font-size: 28px; font-weight: 800; letter-spacing: .02em; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip2 { height: 24px; padding: 0 10px; border-radius: 8px; background: rgba(255,255,255,.08); display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--soft); }
.chip2.accent { background: rgba(240,127,42,.18); color: #ffb27a; }
.switch { margin-left: auto; align-self: flex-start; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
.stat { padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.05); }
.stat small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.stat b { display: block; margin-top: 4px; font-family: var(--display); font-size: 22px; }
.stat b i { font-style: normal; font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 3px; }
.actions { display: flex; gap: 10px; }
.actions .play { flex: 1; padding: 0; }

.widgets { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.widget { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(12px); transition: transform .25s var(--ease), border-color .2s; }
.widget:hover { transform: translateY(-3px); border-color: var(--line-2); }
.widget .ico { width: 38px; height: 38px; border-radius: 11px; background: rgba(240,127,42,.16); display: flex; align-items: center; justify-content: center; color: #ffb27a; }
.widget .ico svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.widget b { display: block; font-size: 14px; }
.widget small { color: var(--muted); font-size: 12px; }

.character { right: 5%; bottom: 14px; }
.character .btn { margin-top: -50px; position: relative; z-index: 4; }
</style></head>
<body><div class="app">
  <div class="scene"></div><div class="shade"></div>
  <nav class="rail">
    <div class="logo"><img src="assets/flame.ico" alt=""></div>
    <button class="nav active"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button class="nav"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/></svg>Profiles</button>
    <button class="nav"><svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7zM3 7l9 5 9-5M12 12v10"/></svg>Mods</button>
    <button class="nav"><svg viewBox="0 0 24 24"><path d="M8 3 3 6l2 4 2-1v12h10V9l2 1 2-4-5-3c-1 2-7 2-8 0z"/></svg>Skins</button>
    <button class="nav settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg></button>
  </nav>
  <div class="account"><button class="chip"><span class="head"></span>Arnxld<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button></div>

  <main class="main">
    <div class="hello rise">Welcome back, <b>Arnxld</b></div>
    <section class="card rise" style="animation-delay:.08s">
      <div class="profile-top">
        <span class="tile-ico" style="background:#f07f2a">AS</span>
        <div><h2>Auroria Survival</h2>
          <div class="chips"><span class="chip2"><span class="dot"></span>Ready</span><span class="chip2">1.21.1</span><span class="chip2">Fabric</span><span class="chip2 accent">Auroria Client</span></div></div>
        <button class="btn switch">Switch</button>
      </div>
      <div class="stats">
        <div class="stat"><small>Mods</small><b>38</b></div>
        <div class="stat"><small>Memory</small><b>6<i>GB</i></b></div>
        <div class="stat"><small>Last played</small><b>2<i>h ago</i></b></div>
      </div>
      <div class="actions">
        <button class="play"><svg viewBox="0 0 14 16"><path d="M1 1l12 7-12 7z"/></svg>PLAY</button>
        <button class="btn" aria-label="Edit profile"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
        <button class="btn" aria-label="Open folder"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
      </div>
    </section>
    <div class="widgets rise" style="animation-delay:.18s">
      <div class="widget"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 2l9 5v10l-9 5-9-5V7zM3 7l9 5 9-5M12 12v10"/></svg></span><span><b>3 mod updates</b><small>Sodium, Lithium and 1 more</small></span></div>
      <div class="widget"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/></svg></span><span><b>124 online</b><small>play.example.net</small></span></div>
    </div>
  </main>

  <div class="character rise" style="animation-delay:.2s">
    <div class="viewer3d" data-w="440" data-h="560" data-zoom="0.84" data-cx="0.85" data-cy="0.06"></div>
    <button class="btn">Change skin</button>
  </div>
</div>
<script src="assets/skinview3d.js"></script><script src="shared.js"></script>
</body></html>

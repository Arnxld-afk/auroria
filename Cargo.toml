[package]
name = "auroria"
version = "1.3.0"
edition = "2021"
license = "MIT"
description = "Auroria Launcher for Minecraft: Java Edition"
repository = "https://github.com/Arnxld-afk/auroria"
build = "build.rs"

[[bin]]
name = "Auroria"
path = "src/main.rs"

[dependencies]
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
miniz_oxide = "0.8"
crc32fast = "1"
sha1_smol = "1"
sha2 = "0.10"
regex-lite = "0.1"
getrandom = "0.2"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

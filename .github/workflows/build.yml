name: Build

# Builds Auroria.exe from this repository so every release can be traced to its source (required for SignPath signing).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Build Auroria.exe
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: Auroria-${{ github.ref_name }}
          path: target/release/Auroria.exe
          if-no-files-found: error

name: Build

# Builds Auroria.exe from this repository so every release can be traced to its source (required for SignPath signing).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: npm ci
      - name: Build Auroria.exe
        shell: pwsh
        run: node build.mjs (Get-Command node).Source
      - uses: actions/upload-artifact@v4
        with:
          name: Auroria-${{ github.ref_name }}
          path: dist/Auroria.exe
          if-no-files-found: error
